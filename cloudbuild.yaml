steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/invento-lite-backend', './backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/invento-lite-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'invento-lite-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/invento-lite-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,MONGO_DB=invento,CORS_ORIGINS=https://invento-lite.web.app,https://invento-lite.firebaseapp.com'
      - '--set-secrets'
      - 'MONGO_URI=MONGO_URI:latest,JWT_SECRET=JWT_SECRET:latest'

options:
  logging: CLOUD_LOGGING_ONLY